# T032, T048, T068, T069: the constitution's gates, run on every change.
#
# A gate that only runs when someone remembers to run it protects nothing.
name: gates

on:
  # A commit on a branch is reached through its pull request, and master through
  # the push that lands it. Listening to both events unqualified ran the whole
  # suite twice for every commit: once as `push` on the branch and once as
  # `pull_request` on the merge ref, same SHA, same result, double the minutes.
  push:
    branches: [master]
  pull_request:
  # So the suite can be run deliberately — from `make ci`, or from the Actions
  # tab — rather than only as a side effect of pushing.
  workflow_dispatch:
    inputs:
      restore_private:
        description: "Make the repository private again when the run finishes"
        type: boolean
        default: true

jobs:
  boundary-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        # GPUI links against these; without them the workspace does not compile,
        # which is what every Linux job failed on the first time CI ever ran.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Gate 1 - architectural boundaries
        run: cargo run --quiet -p gate-boundary
      - name: Every gate refuses rather than passes without its prerequisites
        run: ./tools/check-prerequisites.sh
      - name: Gate 9 - sequencing script tests
        # The extension is maintained in the spec-kit repository, but the copy
        # vendored here is the one that decides whether a feature may be
        # specified, so it is the copy these thirty tests run against.
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest .specify/extensions/featuremap/tests/ -q
      - name: Gate 9 - feature sequencing
        run: |
          python3 .specify/extensions/featuremap/scripts/python/feature_map.py verify
          python3 .specify/extensions/featuremap/scripts/python/feature_map.py resolve
      - name: Gate 9 - blocks a feature whose dependencies are unfinished
        # A gate never seen to block has not been validated, and exit 2 is part
        # of the command-line contract that calling resolve() in a unit test
        # does not exercise.
        #
        # Against a fixture rather than specs/features-map.md. This step used to
        # resolve F001, whose dependency F000 was unfinished, and it passed for
        # as long as that stayed true — then F000 was completed and the step
        # failed, having proved nothing about the gate. A negative test anchored
        # to live project state expires the moment the project advances, and
        # naming a different real feature only moves the expiry date.
        run: |
          fixture="$(mktemp -d)/features-map.md"
          cat > "${fixture}" <<'MAP'
          # Fixture

          ## Tier 0

          - [ ] **F900 unfinished-dependency**
            - Spec: specs/900-unfinished-dependency
            - [ ] Something nobody has done
          - [ ] **F901 blocked-on-it** (depends: F900)
            - Spec: specs/901-blocked-on-it
            - [ ] Something that cannot start
          MAP
          sed -i 's/^          //' "${fixture}"

          set +e
          python3 .specify/extensions/featuremap/scripts/python/feature_map.py \
            resolve F901 --map "${fixture}"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 (blocked), got $code" >&2
            exit 1
          fi

  fidelity:
    # Capture runs under a headless wlroots session inside the pinned image:
    # GPUI presents a Vulkan swapchain, and X11 would need DRI3 that a machine
    # without a GPU does not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        # GPUI links against these; without them the workspace does not compile,
        # which is what every Linux job failed on the first time CI ever ran.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev
      - name: Gate 8 - off-token lint
        run: cargo run --quiet -p gate-fidelity -- lint
      - name: Gate 8 - discrepancy triage
        run: cargo run --quiet -p gate-fidelity -- discrepancies
      - name: Gate 8 - token extraction
        run: cargo run --quiet -p gate-fidelity -- extract
      - name: Gate 8 - extraction is deterministic
        run: |
          cp tools/gate-fidelity/out/tokens.json /tmp/first.json
          cargo run --quiet -p gate-fidelity -- extract
          diff -q /tmp/first.json tools/gate-fidelity/out/tokens.json
  # The pixel comparison, deliberately not on every push.
  #
  # It compiles the workspace twice — once on the runner for the steps above,
  # and once inside the pinned image, which needs its own target directory
  # because its glibc is older than the runner's. Both are cold on a fresh
  # runner and GPUI dominates each, so the step ran past twenty-three minutes
  # without finishing, against SC-007's fifteen for the whole suite.
  #
  # Running it on demand is closer to how it is actually used than running it on
  # every push was: the reference can only be captured inside this same image,
  # so the comparison has always been something a person performs in the pinned
  # environment rather than something CI watches. `make compare` takes about six
  # seconds warm.
  #
  # The cache makes the second dispatch cheap. Its key includes the Containerfile
  # because objects built inside the image are valid only for that image.
  fidelity-comparison:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/pinned-env
          key: fidelity-compare-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/gate-fidelity/pinned-env/Containerfile') }}
          restore-keys: fidelity-compare-
      - name: Gate 8 - prototype fidelity
        run: ./tools/gate-fidelity/run-in-pinned-env.sh compare

  macos-build:
    # Proves the product compiles for arm64 macOS, links against Metal and
    # starts. It does not judge budgets.
    #
    # It used to, and called itself authoritative. The runner is 3 arm64 vCPUs
    # and 7 GB; it reported a cold start of 1568 ms where an M3 Pro reports 95 ms
    # for the same commit. Two machines disagreeing by sixteen times cannot both
    # inform a budget, and this is the one further from the six-core, 8 GB
    # baseline. Verdicts come from `make macos-verify` on real hardware until
    # there is a machine of the baseline's class to run them on (T120).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A cold build of GPUI dominates the suite's runtime on three cores, and
      # SC-007 budgets the whole suite at fifteen minutes.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-26-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-26-cargo-

      # Printed before the gate runs so the log says what machine produced the
      # numbers, whatever the gate then decides.
      - name: Observed machine
        run: |
          echo "arch:        $(uname -m)"
          echo "macOS:       $(sw_vers -productVersion)"
          echo "logical:     $(sysctl -n hw.logicalcpu)"
          echo "performance: $(sysctl -n hw.perflevel0.logicalcpu 2>/dev/null || echo 'not reported')"
          echo "efficiency:  $(sysctl -n hw.perflevel1.logicalcpu 2>/dev/null || echo 'not reported')"
          echo "memory:      $(( $(sysctl -n hw.memsize) / 1024 / 1024 )) MB"

      - name: Build for arm64 macOS
        # GPUI presents through Metal here and Vulkan on Linux, so this is the
        # only check that the product builds for a platform it claims to target.
        run: cargo build --workspace --quiet

      - name: The shell starts and resolves its layout
        run: cargo run --quiet -p shell-preview -- --smoke

      - name: Tests
        run: cargo test --workspace


  budgets-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        # GPUI links against these; without them the workspace does not compile,
        # which is what every Linux job failed on the first time CI ever ran.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev
      - name: Gate 5 - resource budgets (advisory)
        # The shell is spawned by the gate, so it has to exist before the gate
        # runs; `cargo run -p gate-budget` builds only the gate.
        #
        # The gate answers in three values, and this job has to honour all
        # three. GitHub's hosted runners have four cores and the baseline is
        # six, so the gate refuses with exit 1 — a quota cannot conjure cores
        # that are not there, and reporting unconstrained numbers as if they
        # were the baseline is the one outcome worse than reporting none. That
        # refusal is the gate working, not the job failing, so it is surfaced as
        # a notice. Exit 2 is a real over-budget verdict and still fails. The
        # day a hosted runner has six cores this job starts judging on its own,
        # with no change here.
        run: |
          cargo build --workspace --quiet
          # Applying cpu.max and memory.max needs write access to the cgroup
          # hierarchy. Without this the gate refuses, correctly, every time.
          set +e
          sudo -E env "PATH=$PATH" cargo run --quiet -p gate-budget -- \
            --runner linux-cgroup \
            --report reports/budgets/linux-cgroup.json
          code=$?
          set -e
          case "${code}" in
            0) echo "budgets judged and within budget" ;;
            1) echo "::notice::gate-budget could not judge on this runner; see the message above" ;;
            *) exit "${code}" ;;
          esac

  # The finally block.
  #
  # `if: always()` runs this whatever happened above — a job failed, the whole
  # run was cancelled, a runner died. It needs every other job in `needs` so it
  # cannot start while one is still using the free public-repo minutes.
  #
  # Only on a deliberate dispatch that asked for it. A push to a repository that
  # is public on purpose must not be quietly forced private, and the local
  # `tools/ci.sh cycle` already covers the push case from the other side.
  restore-visibility:
    needs:
      - boundary-and-tests
      - fidelity
      - fidelity-comparison
      - macos-build
      - budgets-advisory
    if: always() && github.event_name == 'workflow_dispatch' && inputs.restore_private
    runs-on: ubuntu-latest
    steps:
      - name: Make the repository private again
        env:
          # The built-in GITHUB_TOKEN cannot change visibility at any permission
          # level, so this needs a token of its own. Fine-grained, this one
          # repository only, Administration: read and write, short expiry.
          GH_TOKEN: ${{ secrets.VISIBILITY_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::VISIBILITY_TOKEN is not set, so this run cannot make ${REPO} private again." >&2
            echo "::error::Set it with: gh secret set VISIBILITY_TOKEN" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            current=$(gh repo view "${REPO}" --json visibility -q .visibility || echo UNKNOWN)
            if [ "${current}" = "PRIVATE" ]; then
              echo "${REPO} is private."
              exit 0
            fi
            echo "attempt ${attempt}: ${current} -> PRIVATE"
            gh repo edit "${REPO}" --visibility private \
              --accept-visibility-change-consequences || true
            sleep $(( attempt * 5 ))
          done

          # Anything reaching here has left the repository readable by the world.
          echo "::error::${REPO} could not be made private. Fix it now: gh repo edit ${REPO} --visibility private --accept-visibility-change-consequences" >&2
          exit 1
